# VirtIO drivers, QEMU guest agent and SPICE agent for a QEMU/KVM guest.
# The RedHat.VirtIO package in winget lags behind virtio-win releases, so the
# current virtio-win-guest-tools.exe from Fedora's stable-virtio directory is
# installed instead (the same build shipped on the virtio-win ISO).
# An older installed version is upgraded; with no internet connection the
# installed version is accepted as good enough.
- resource: PSDscResources/Script
  id: virtio
  directives:
    description: VirtIO Windows guest tools (current stable)
    allowPrerelease: true
    securityContext: elevated
  settings:
    GetScript: |
      $drv = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
        Where-Object { $_.GetValue('DisplayName') -eq 'Virtio-win-driver-installer' } | Select-Object -First 1
      return @{ Result = $(if ($drv) { [string]$drv.GetValue('DisplayVersion') } else { '' }) }
    TestScript: |
      $drv = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
        Where-Object { $_.GetValue('DisplayName') -eq 'Virtio-win-driver-installer' } | Select-Object -First 1
      if (-not $drv) { return $false }
      try {
        Add-Type -AssemblyName System.Net.Http
        $handler = [System.Net.Http.HttpClientHandler]::new(); $handler.AllowAutoRedirect = $false
        $resp = [System.Net.Http.HttpClient]::new($handler).SendAsync([System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Head, 'https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win-guest-tools.exe')).GetAwaiter().GetResult()
        $latest = [regex]::Match([string]$resp.Headers.Location, 'virtio-win-([\d.]+)-\d+/').Groups[1].Value
      } catch { return $true }
      return [bool](-not $latest -or [version]$drv.GetValue('DisplayVersion') -ge [version]$latest)
    SetScript: |
      # The stable-virtio URL redirects to http; the download is forced back to https.
      Add-Type -AssemblyName System.Net.Http
      $handler = [System.Net.Http.HttpClientHandler]::new(); $handler.AllowAutoRedirect = $false
      $resp = [System.Net.Http.HttpClient]::new($handler).SendAsync([System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Head, 'https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win-guest-tools.exe')).GetAwaiter().GetResult()
      $url = [string]$resp.Headers.Location -replace '^http:', 'https:'
      if ($url -notmatch '^https://fedorapeople\.org/.+/virtio-win-guest-tools\.exe$') { throw "Could not resolve latest virtio-win-guest-tools.exe URL (got '$url')" }
      $exe = Join-Path $env:TEMP 'virtio-win-guest-tools.exe'
      Invoke-WebRequest $url -OutFile $exe -UseBasicParsing
      $p = Start-Process $exe -ArgumentList '/install /quiet /norestart' -Wait -PassThru
      if ($p.ExitCode -notin 0, 3010) { throw "virtio-win-guest-tools failed with exit code $($p.ExitCode)" }
