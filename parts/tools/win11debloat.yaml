# Win11Debloat (https://github.com/Raphire/Win11Debloat): removes preinstalled
# apps and turns off telemetry, suggestions, ads, Copilot and Bing search.
#
# - What it does lives in win11debloat.json next to this file (Win11Debloat's
#   own config format: Apps = apps to remove, Tweaks = settings, Deployment =
#   run options). You can open it in the Win11Debloat UI with "Import/Export
#   config" and drop the exported file straight back here. Win11Debloat itself
#   skips settings that do not apply to the running Windows version.
# - build.ps1 writes that file's contents and its SHA256 below (the embed and
#   embedhash tokens), so the generated .winget file runs on its own and needs
#   nothing from the repo beside it. Re-run build.ps1 when the JSON changes.
# - Every run downloads the latest release from GitHub and unpacks it under
#   C:\Program Files\winget-config\Win11Debloat. Win11Debloat's own Logs\ and
#   Backups\ folders (registry backups, for rolling changes back) stay there.
# - On success the embedded config's SHA256 is written to
#   HKLM\SOFTWARE\winget-config\Win11Debloat; if the same content has already
#   been applied, a later config run does not run Win11Debloat again.
- resource: PSDscResources/Script
  id: win11Debloat
  directives:
    description: Win11Debloat (parts\tools\win11debloat.json)
    allowPrerelease: true
    securityContext: elevated
  settings:
    GetScript: |
      $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\winget-config\Win11Debloat')
      return @{ Result = $(if ($key) { "version $($key.GetValue('Version')); config $($key.GetValue('Applied'))" } else { 'not applied' }) }
    TestScript: |
      $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SOFTWARE\winget-config\Win11Debloat')
      return [bool]($key -and $key.GetValue('Applied') -eq '${embedhash:parts/tools/win11debloat.json}')
    SetScript: |
      $hash = '${embedhash:parts/tools/win11debloat.json}'
      # --- embedded config (source: parts\tools\win11debloat.json) ---
      $json = @'
      ${embed:parts/tools/win11debloat.json}
      '@

      # --- download the latest release ---
      $dir     = Join-Path $env:ProgramFiles 'winget-config\Win11Debloat'
      $zip     = Join-Path $env:TEMP 'winget-config-win11debloat.zip'
      $extract = Join-Path $env:TEMP 'winget-config-win11debloat'
      $release = Invoke-RestMethod 'https://api.github.com/repos/Raphire/Win11Debloat/releases/latest'
      Invoke-WebRequest $release.zipball_url -OutFile $zip -UseBasicParsing
      Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
      Expand-Archive $zip $extract -Force
      $archive = @(Get-ChildItem $extract -Directory)
      if ($archive.Count -ne 1 -or -not (Test-Path (Join-Path $archive[0].FullName 'Win11Debloat.ps1'))) { throw "Unexpected Win11Debloat archive layout ($($release.tag_name))" }
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      Get-ChildItem $dir -Exclude 'Logs', 'Backups' | Remove-Item -Recurse -Force
      Copy-Item (Join-Path $archive[0].FullName '*') $dir -Recurse -Force
      Remove-Item $zip, $extract -Recurse -Force -ErrorAction SilentlyContinue
      $config = Join-Path $dir 'winget-config.json'
      [IO.File]::WriteAllText($config, $json, [Text.UTF8Encoding]::new($false))

      # --- run it ---
      # Win11Debloat needs Windows PowerShell 5.1, and winget's PowerShell 7
      # module paths make 5.1 fail to load modules, so they are stripped for
      # the duration of the call.
      $modulePath = $env:PSModulePath
      try {
        $env:PSModulePath = ($env:PSModulePath -split ';' | Where-Object { $_ -like '*WindowsPowerShell*' }) -join ';'
        $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Win11Debloat.ps1') -Config $config -Silent 2>&1 | Out-String
        $exitCode = $LASTEXITCODE
      } finally {
        $env:PSModulePath = $modulePath
      }
      if ($exitCode -ne 0) { throw "Win11Debloat $($release.tag_name) failed with exit code ${exitCode}:`n$output" }

      $key = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey('SOFTWARE\winget-config\Win11Debloat')
      $key.SetValue('Applied', $hash)
      $key.SetValue('Version', [string]$release.tag_name)
      $key.Dispose()
