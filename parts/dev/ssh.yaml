# Microsoft.Windows.Developer/WindowsCapability calls the DISM cmdlets, which
# fail inside winget's DSC host with "Class not registered". dism.exe runs in
# its own process and is not affected; the tests only look for the binaries.
- resource: PSDscResources/Script
  id: sshClient
  directives:
    description: OpenSSH client
    allowPrerelease: true
    securityContext: elevated
  settings:
    GetScript: |
      $exe = Join-Path $env:SystemRoot 'System32\OpenSSH\ssh.exe'
      return @{ Result = $(if (Test-Path $exe) { 'installed' } else { 'not installed' }) }
    TestScript: |
      return [bool](Test-Path (Join-Path $env:SystemRoot 'System32\OpenSSH\ssh.exe'))
    SetScript: |
      $output = & (Join-Path $env:SystemRoot 'System32\dism.exe') /Online /Add-Capability /CapabilityName:OpenSSH.Client~~~~0.0.1.0 /NoRestart 2>&1 | Out-String
      # 3010: installed, restart required.
      if ($LASTEXITCODE -notin 0, 3010) { throw "dism /Add-Capability OpenSSH.Client failed with exit code ${LASTEXITCODE}:`n$output" }

- resource: PSDscResources/Script
  id: sshServer
  directives:
    description: OpenSSH server
    allowPrerelease: true
    securityContext: elevated
  settings:
    GetScript: |
      $exe = Join-Path $env:SystemRoot 'System32\OpenSSH\sshd.exe'
      return @{ Result = $(if (Test-Path $exe) { 'installed' } else { 'not installed' }) }
    TestScript: |
      return [bool](Test-Path (Join-Path $env:SystemRoot 'System32\OpenSSH\sshd.exe'))
    SetScript: |
      $output = & (Join-Path $env:SystemRoot 'System32\dism.exe') /Online /Add-Capability /CapabilityName:OpenSSH.Server~~~~0.0.1.0 /NoRestart 2>&1 | Out-String
      # 3010: installed, restart required.
      if ($LASTEXITCODE -notin 0, 3010) { throw "dism /Add-Capability OpenSSH.Server failed with exit code ${LASTEXITCODE}:`n$output" }

- resource: PSDscResources/Service
  id: sshdService
  dependsOn:
    - sshServer
  directives:
    description: sshd service, automatic startup and running
    allowPrerelease: true
    securityContext: elevated
  settings:
    Name: sshd
    StartupType: Automatic
    State: Running

# Installing the OpenSSH server creates this rule; here we make sure it stays
# enabled, and recreate it if it was removed.
- resource: Microsoft.Windows.Developer/FirewallRule
  id: sshFirewall
  dependsOn:
    - sshServer
  directives:
    description: Firewall rule allowing SSH (TCP 22)
    allowPrerelease: true
    securityContext: elevated
  settings:
    Name: OpenSSH-Server-In-TCP
    DisplayName: OpenSSH Server (sshd)
    Direction: Inbound
    Action: Allow
    Protocol: TCP
    LocalPort:
      - '22'
    # Left empty, the resource passes a null Profile to Set-NetFirewallRule and fails.
    Profiles:
      - Any
    Enabled: true
